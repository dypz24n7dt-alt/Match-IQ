<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#101b2d"><title>MATCH IQ</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b2d;color:#edf5ff;font:16px system-ui;padding:env(safe-area-inset-top) 16px calc(30px + env(safe-area-inset-bottom));max-width:760px;margin:auto}h1{letter-spacing:2px;color:#65dfc6;margin-bottom:0}small,p{color:#aebed2}section{background:#1b2c43;padding:16px;border-radius:16px;margin:12px 0}button,input,select,textarea{font:inherit;border:1px solid #49617a;border-radius:9px;padding:12px;color:inherit;background:#263c55;min-width:0}input,select,textarea{width:100%;margin:5px 0 12px}button{cursor:pointer;margin:3px}button.primary,button.active{background:#65dfc6;color:#102333;border-color:#65dfc6;font-weight:bold}nav{display:flex;flex-wrap:wrap}label{display:block;color:#b8c9dd;font-size:14px}.goal{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border:6px solid white;border-top:6px dashed #e65d65;padding:4px}.goal button{margin:0;min-height:76px;font-size:13px}.goal b{display:block;font-size:20px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}a{color:#65dfc6;overflow-wrap:anywhere}article{border-top:1px solid #49617a;padding:12px 0}progress{width:100%;accent-color:#65dfc6}h2{font-size:20px}h3{font-size:16px}video{width:100%}.muted{font-size:13px;color:#aebed2}</style></head><body><h1>MATCH IQ</h1><small>HANDBALL SCOUTING · V3 · 2026/27</small><nav id="nav"></nav><main id="main"></main><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2), opts=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');

, "pos": "Unbekannt", "hand": "Wurfarm unbekannt"}, {"id": "nr15", "name": "Nick Weiland", "num": "", "pos": "Unbekannt", "hand": "Wurfarm unbekannt"}, {"id": "nr16", "name": "Florian Stenger", "num": "", "pos": "Unbekannt", "hand": "Wurfarm unbekannt"}, {"id": "nr17", "name": "Luke Eimuth", "num": "", "pos": "Unbekannt", "hand": "Wurfarm unbekannt"}, {"id": "nr18", "name": "Philipp Hoepffner", "num": "", "pos": "Unbekannt", "hand": "Wurfarm unbekannt"}, {"id": "nr19", "name": "Frederic Berger", "num": "", "pos": "Unbekannt", "hand": "Wurfarm unbekannt"}, {"id": "nr20", "name": "Philipp Bludau", "num": "", "pos": "Unbekannt", "hand": "Wurfarm unbekannt"}, {"id": "nr21", "name": "Samuel Hoddersen", "num": "", "pos": "Unbekannt", "hand": "Wurfarm unbekannt"}, {"id": "nr22", "name": "Simon Brandt", "num": "", "pos": "Unbekannt", "hand": "Wurfarm unbekannt"}]}, {"id": "sw8", "name": "Longericher SC Köln", "players": []}, {"id": "sw9", "name": "TSV Bayer Dormagen II", "players": []}, {"id": "sw10", "name": "TuS 1882 Opladen", "players": []}, {"id": "sw11", "name": "TV Gelnhausen", "players": []}, {"id": "sw12", "name": "TV Kirchzell", "players": []}, {"id": "sw13", "name": "TSG Münster", "players": []}, {"id": "sw14", "name": "Interaktiv. Handball Düsseldorf/Ratingen", "players": []}, {"id": "sw15", "name": "S3L Handball", "players": []}];
let db;try{db=JSON.parse(localStorage.getItem('matchiq-v1'))||seed}catch{db=seed}for(const t of league){let old=db.teams.find(x=>x.id===t.id||x.name.toLowerCase()===t.name.toLowerCase());if(!old)db.teams.push(t);else for(const p of t.players){if(!old.players.some(x=>x.name.toLowerCase()===p.name.toLowerCase()))old.players.push(p)}}let team=db.teams[0].id,tab='Übersicht',zone=-1; const circle=e=>e.type==='Torwart'&&e.origin==='Kreis';const tabs=['Übersicht','Spieler','1 gegen 1','Kreis','Torwart','Videos','Statistik','Sicherung'];const zones=['Oben links','Oben Mitte','Oben rechts','Mitte links','Mitte','Mitte rechts','Unten links','Unten Mitte','Unten rechts'];const positions=['Unbekannt','Rückraum Mitte','Rückraum Links','Rückraum Rechts','Kreisläufer','Linksaußen','Rechtsaußen','Torhüter'];const moves={'1 gegen 1':['Durchbruch Wurfarmseite','Durchbruch Gegenseite','Körpertäuschung','Überzieher','Doppelfinte','Richtungswechsel','Aktion nach Kreuzung'],'Kreis':['Sperre stellen','Sperre lösen','Absetzen','Einlaufen','Drehung links','Drehung rechts','Nachrücken'],'Torwart':['Stehenbleiben','Frühe Grätsche','Herauskommen','Armabwehr','Beinabwehr','Breitmachen','Andere / unklar']};
function save(){try{localStorage.setItem('matchiq-v1',JSON.stringify(db))}catch(e){alert('Speichern fehlgeschlagen. Bitte Sicherung exportieren.')}}function current(){return db.teams.find(t=>t.id===team)}function events(){return db.events.filter(e=>e.team===team)}function player(id){return current().players.find(p=>p.id===id)?.name||'Unbekannt'}function safe(u){try{return ['https:','http:'].includes(new URL(u).protocol)?esc(u):'#'}catch{return '#'}}function go(t){tab=t;zone=-1;render()}function render(){ $('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="go('${t}')">${t}</button>`).join('');let h=`<label>Mannschaft<select onchange="team=this.value;zone=-1;render()">${db.teams.map(t=>`<option value="${esc(t.id)}" ${t.id===team?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label>`;let es=events();if(tab==='Übersicht')h+=`<section><h2>${esc(current().name)}</h2><p>${current().players.length} Spieler · ${es.length} Aktionen · ${db.videos.filter(v=>v.team===team).length} Videos</p><p>Manuelle Analyse mit automatischer Statistik. Keine KI-Erkennung.</p><input id="newteam" placeholder="Neuer Verein"><button onclick="addTeam()">Verein hinzufügen</button></section><section><h2>Matchplan</h2><textarea id="plan" placeholder="Taktische Erkenntnisse">${esc(current().plan||'')}</textarea><button onclick="current().plan=$('plan').value;save();alert('Gespeichert')">Matchplan speichern</button></section>`;
if(tab==='Spieler')h+=`<section><h2>Spieler anlegen</h2><input id="pn" placeholder="Name"><input id="num" placeholder="Rückennummer" inputmode="numeric"><select id="pos">${opts(positions)}</select><select id="hand">${opts(['Wurfarm unbekannt','Rechts','Links'])}</select><button class="primary" onclick="addPlayer()">Speichern</button><p class="muted">Staffel 2026/27: 16 Teams. Nieder-Roden: 23 Namen laut Vereinsseite; Hanau: 19 recherchierte Spieler; übrige Kader noch nicht importiert. Fehlende Daten anhand des Spielberichts ergänzen.</p></section><section>${current().players.map(p=>`<article><b>#${esc(p.num)} ${esc(p.name)}</b><p>${esc(p.pos)} · ${esc(p.hand)} · ${es.filter(e=>e.player===p.id).length} Aktionen</p><button onclick="editPlayer('${p.id}')">Bearbeiten</button></article>`).join('')||'Noch keine Spieler'}</section>`;
if(moves[tab])h+=`<section><h2>${tab==='Torwart'?'Torwart – nur Kreiswürfe':tab} erfassen</h2><label>${tab==='Torwart'?'Gegnerischer Torhüter':'Spieler'}<select id="pl"><option value="">Unbekannt</option>${current().players.filter(p=>tab!=='Torwart'||(p.pos==='Torhüter'||(current().id!=='hanau'&&p.pos==='Unbekannt'))).map(p=>`<option value="${p.id}">#${esc(p.num)} ${esc(p.name)}</option>`).join('')}</select></label><label>${tab==='Torwart'?'Torwartreaktion':'Bewegung'}<select id="move">${opts(moves[tab])}</select></label>${tab==='Torwart'?`<label>Werfender Kreisläufer (Name / Verein)<input id="shooter" list="circleplayers" placeholder="Name oder Rückennummer"><datalist id="circleplayers">${db.teams.flatMap(t=>t.players.filter(p=>p.pos==='Kreisläufer').map(p=>`<option value="${esc(p.name+' / '+t.name)}"></option>`)).join('')}</datalist></label><p>Nur Würfe vom Kreis · Tor aus Sicht des Werfers</p><div class="goal">${zones.map((z,i)=>`<button id="z${i}" onclick="pick(${i})">${z}<b>${es.filter(e=>circle(e)&&e.zone===i).length}</b></button>`).join('')}</div><button onclick="pick(-1)">Außerhalb / unklar</button><p>Wurfposition: Kreis (fest)</p><label>Wurfart<select id="kind">${opts(['Unklar','Schlagwurf','Sprungwurf','Dreher','Heber','Aufsetzer'])}</select></label>`:''}<label>Ergebnis<select id="result">${opts(tab==='Torwart'?['Tor','Gehalten','Daneben','Pfosten/Latte']:['Erfolgreich','Nicht erfolgreich','Unklar'])}</select></label><label>Video<select id="vid"><option value="">Kein Video</option>${db.videos.filter(v=>v.team===team).map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')}</select></label><div class="row"><label>Clip Start (mm:ss)<input id="start" placeholder="12:34"></label><label>Clip Ende (mm:ss)<input id="end" placeholder="12:42"></label></div><label>Notiz<textarea id="note"></textarea></label><button class="primary" onclick="addEvent()">Aktion speichern</button></section>`;
if(tab==='Videos')h+=`<section><h2>Video hinzufügen</h2><input id="vn" placeholder="Spielname"><input id="vu" type="url" placeholder="https://…"><button onclick="addVideo()">Link speichern</button><p>Lokales Video ansehen (wird nicht dauerhaft gespeichert)</p><input type="file" accept="video/*" onchange="if(this.files[0])$('localvideo').src=URL.createObjectURL(this.files[0])"><video id="localvideo" controls playsinline></video></section><section>${db.videos.filter(v=>v.team===team).map(v=>`<article><a href="${safe(v.url)}" target="_blank" rel="noopener">${esc(v.name)} ↗</a></article>`).join('')}</section>`;
if(tab==='Statistik')h+=`<section><h2>Statistik</h2><label>Spieler<select id="filter" onchange="stats()"><option value="">Alle</option>${current().players.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><p>Torwartstatistik: ausschließlich Kreiswürfe</p><div id="stats"></div></section>`;
if(tab==='Sicherung')h+=`<section><h2>Daten sichern</h2><p>Die Daten bleiben in diesem Browser. Beim Löschen der Websitedaten können sie verloren gehen. Regelmäßig exportieren.</p><button onclick="backup()">JSON exportieren</button><label>Sicherung importieren (ersetzt aktuelle Daten)<input type="file" accept=".json,application/json" onchange="restore(this)"></label></section>`;$('main').innerHTML=h;if(tab==='Statistik')stats()}
function pick(i){zone=i;zones.forEach((_,j)=>$('z'+j)?.classList.toggle('active',j===i))}function addTeam(){let n=$('newteam').value.trim();if(!n)return;team=uid();db.teams.push({id:team,name:n,players:[]});save();render()}function addPlayer(){let n=$('pn').value.trim();if(!n)return;current().players.push({id:uid(),name:n,num:$('num').value,pos:$('pos').value,hand:$('hand').value});save();render()}function editPlayer(id){let p=current().players.find(p=>p.id===id),n=prompt('Name',p.name);if(n===null||!n.trim())return;p.name=n.trim();let num=prompt('Rückennummer',p.num);if(num!==null)p.num=num;let pos=prompt('Position: '+positions.join(', '),p.pos);if(pos!==null&&positions.includes(pos))p.pos=pos;save();render()}function addVideo(){let n=$('vn').value.trim(),u=$('vu').value.trim();if(!n||safe(u)==='#')return alert('Name und gültigen HTTP(S)-Link eingeben');db.videos.push({id:uid(),team,name:n,url:u});save();render()}function seconds(s){if(!s.trim())return null;if(!/^\d+(?::[0-5]\d){0,2}$/.test(s.trim()))return NaN;return s.split(':').reduce((a,b)=>a*60+Number(b),0)}function addEvent(){let a=seconds($('start').value),b=seconds($('end').value);if(Number.isNaN(a)||Number.isNaN(b)||(b!==null&&(a===null||b<a)))return alert('Zeitstempel prüfen');db.events.push({id:uid(),team,type:tab,player:$('pl').value,move:$('move').value,zone:tab==='Torwart'?zone:-1,origin:tab==='Torwart'?'Kreis':'',shooter:$('shooter')?.value.trim()||'',kind:$('kind')?.value||'',result:$('result').value,video:$('vid').value,start:$('start').value,end:$('end').value,note:$('note').value});save();$('note').value='';$('start').value='';$('end').value='';alert('Aktion gespeichert');if(tab==='Torwart'){let k=$('pl').value;render();$('pl').value=k;pick(-1)}}
function stats(){let f=$('filter').value,es=events().filter(e=>(!f||e.player===f)&&(e.type!=='Torwart'||circle(e))),h=`<p>${es.length} erfasste Aktionen</p>`;for(let t of Object.keys(moves)){let a=es.filter(e=>e.type===t);h+=`<h3>${t} (${a.length})</h3>`;for(let m of moves[t]){let n=a.filter(e=>e.move===m).length;if(n)h+=`<div>${esc(m)}: ${n} (${Math.round(n/a.length*100)}%)<progress max="${a.length}" value="${n}"></progress></div>`}if(t==='Torwart'){let g=a.filter(e=>e.result==='Tor').length,s=a.filter(e=>e.result==='Gehalten').length;h+=`<p>${g} Tore · ${s} Paraden · Fangquote ${g+s?Math.round(s/(g+s)*100)+'%':'–'} (nur Tore und Paraden)</p><div class="goal">${zones.map((z,i)=>{let q=a.filter(e=>e.zone===i),g=q.filter(e=>e.result==='Tor').length,s=q.filter(e=>e.result==='Gehalten').length;return `<button onclick="showZone(${i})">${z}<b>${g}/${s}</b><small>${q.length} Würfe · ${g+s?Math.round(g/(g+s)*100)+'% Torquote aufs Tor':'–'}</small></button>`}).join('')}</div><small>Tore / Paraden je Zielzone · Feld antippen für Szenen</small><div id="zoneclips"></div>`}}h+='<h3>Alle Szenen</h3>'+es.map(eventHTML).join('');$('stats').innerHTML=h}function eventHTML(e){let v=db.videos.find(v=>v.id===e.video);return `<article><b>${esc(player(e.player))} · ${esc(e.move)}</b><p>${esc(e.result)} ${e.zone>=0?'· '+zones[e.zone]:''} ${esc(e.origin)} ${esc(e.kind)}<br>${e.shooter?'Werfer: '+esc(e.shooter)+'<br>':''}${esc(e.note)}</p>${v?`<a href="${safe(v.url)}" target="_blank" rel="noopener">${esc(v.name)} ↗</a>`:''}<p>Zeit: ${esc(e.start||'–')} ${e.end?'– '+esc(e.end):''}</p><button onclick="removeEvent('${e.id}')">Löschen</button></article>`}function showZone(i){let f=$('filter').value;$('zoneclips').innerHTML='<h3>'+zones[i]+'</h3>'+events().filter(e=>circle(e)&&e.zone===i&&(!f||e.player===f)).map(eventHTML).join('')}function removeEvent(id){if(confirm('Aktion löschen?')){db.events=db.events.filter(e=>e.id!==id);save();stats()}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='match-iq-sicherung.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(el){try{let d=JSON.parse(await el.files[0].text());if(!Array.isArray(d.teams)||!d.teams.length||!d.teams.every(t=>typeof t.id==='string'&&Array.isArray(t.players))||!Array.isArray(d.events)||!Array.isArray(d.videos))throw Error();if(confirm('Aktuelle Daten ersetzen?')){db=d;team=d.teams[0].id;save();render()}}catch{alert('Ungültige Sicherung')}}render();save();
</script></body></html>
